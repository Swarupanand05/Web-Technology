<!DOCTYPE html>
<html lang="mr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>बजबळकर रोपवाटिका — Admin Login</title>
  <meta name="description" content="बजबळकर रोपवाटिका Admin Management Portal" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body class="login-page">

  <div class="login-card">
    <div class="login-logo">
      <div class="login-logo-img-wrap">
        <img id="loginLogoImg" src="/images/logo.png" alt="बजबळकर रोपवाटिका"
          class="login-logo-img"
          onerror="this.style.display='none';document.getElementById('loginLogoEmoji').style.display='block';" />
        <span id="loginLogoEmoji" class="icon" style="display:none;">🌿</span>
      </div>
      <h1>बजबळकर रोपवाटिका</h1>
      <p>काळ्या आईच्या आरोग्यासाठी हरित क्रांतीच्या दिशेने</p>
    </div>

    <div class="error-msg" id="loginError">
      ⚠️ Invalid username or password. Please try again.
    </div>

    <form id="loginForm" novalidate>
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" placeholder="Enter admin username" autocomplete="username" />
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Enter your password" autocomplete="current-password" />
      </div>
      <button type="submit" class="btn btn-primary" id="loginBtn">
        🔐 Sign In
      </button>
    </form>
  </div>

  <script src="/js/auth.js"></script>
</body>
</html>
